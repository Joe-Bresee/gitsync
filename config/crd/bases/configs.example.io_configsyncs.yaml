---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: configsyncs.configs.example.io
spec:
  group: configs.example.io
  names:
    kind: ConfigSync
    listKind: ConfigSyncList
    plural: configsyncs
    singular: configsync
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ConfigSync is the Schema for the configsyncs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ConfigSync
            properties:
              clusters:
                description: Clusters defines named remote cluster credential boundaries.
                items:
                  description: |-
                    ClusterSpec defines a credential boundary for a named remote cluster.
                    Remote clusters are opt-in and require a kubeconfig Secret.
                  properties:
                    allowedNamespaces:
                      description: AllowedNamespaces restricts remote writes. Empty
                        allows all namespaces.
                      items:
                        type: string
                      type: array
                    kubeconfigSecretRef:
                      description: KubeconfigSecretRef identifies a Secret containing
                        a `kubeconfig` key.
                      properties:
                        name:
                          description: Name is the name of the referenced object (ConfigMap
                            or Secret).
                          type: string
                        namespace:
                          description: Namespace is the namespace of the referenced
                            object.
                          type: string
                      required:
                      - name
                      type: object
                    name:
                      description: Name is the name referenced by target.cluster.
                      minLength: 1
                      type: string
                  required:
                  - kubeconfigSecretRef
                  - name
                  type: object
                type: array
              encryptedConfig:
                description: EncryptedConfig enables optional SOPS/KMS decryption
                  of source manifests.
                properties:
                  binary:
                    description: Binary is an optional sops executable name or absolute
                      path.
                    type: string
                  keySecretRef:
                    description: |-
                      KeySecretRef optionally references credentials consumed by the external
                      decryption provider.
                    properties:
                      name:
                        description: Name is the name of the referenced object (ConfigMap
                          or Secret).
                        type: string
                      namespace:
                        description: Namespace is the namespace of the referenced
                          object.
                        type: string
                    required:
                    - name
                    type: object
                  provider:
                    description: Provider is currently `sops`.
                    enum:
                    - sops
                    type: string
                required:
                - provider
                type: object
              environment:
                description: |-
                  Environment selects the branch and overlay for this ConfigSync.
                  Its explicit settings take precedence over compact values on
                  spec.source.git. If revision is set, it remains the explicit Git
                  revision and takes precedence over branch.
                properties:
                  branch:
                    description: |-
                      Branch selects the Git branch for this environment. If omitted, the
                      repository default branch is used unless spec.source.git.revision is set.
                    type: string
                  data:
                    additionalProperties:
                      type: string
                    description: |-
                      Data contains additional string values exposed to templates as
                      .Environment.Data and merged into .Data/.Values.
                    type: object
                  name:
                    description: Name identifies the environment (for example, staging
                      or production).
                    type: string
                  overlay:
                    description: Overlay is a repository-relative path appended to
                      spec.source.git.path.
                    type: string
                type: object
              pruning:
                description: Pruning enables explicit deletion of managed resources
                  absent from source.
                properties:
                  enabled:
                    description: |-
                      Enabled permits deletion of previously managed resources that disappear
                      from the source. Disabled is the safe default.
                    type: boolean
                required:
                - enabled
                type: object
              refreshInterval:
                description: |-
                  RefreshInterval controls how frequently the operator should re-fetch
                  the source and re-apply targets. It uses Kubernetes duration format
                  (e.g. `10m`, `1h`). If omitted, the operator's default behavior applies.
                pattern: ^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$
                type: string
              rollback:
                description: |-
                  Rollback selects an explicit Git revision instead of the normal source
                  branch/revision. Remove it to resume normal source selection.
                properties:
                  revision:
                    description: Revision is a Git branch, tag, or commit SHA to apply.
                    minLength: 1
                    type: string
                required:
                - revision
                type: object
              source:
                description: |-
                  foo is an example field of ConfigSync. Edit configsync_types.go to remove/update
                  Source defines where to fetch configuration data from. Only the `git` field
                  is supported as the source in this operator.
                properties:
                  git:
                    description: Git references a Git repository and path to read
                      the configuration from.
                    properties:
                      authMethod:
                        description: |-
                          AuthMethod controls how the operator authenticates to the Git repository.
                          Allowed values are `ssh`, `https`, or `none`.
                        enum:
                        - ssh
                        - https
                        - none
                        type: string
                      authSecretRef:
                        description: |-
                          AuthSecretRef references a Secret that contains an SSH private key and
                          known_hosts data, or basic auth credentials when `AuthMethod=ssh` or
                          `AuthMethod=https`. SSH Secrets should contain `id_rsa` (or `sshKey`) and
                          `known_hosts`; HTTPS Secrets should contain `username` and `password`.
                        properties:
                          name:
                            description: Name is the name of the referenced object
                              (ConfigMap or Secret).
                            type: string
                          namespace:
                            description: Namespace is the namespace of the referenced
                              object.
                            type: string
                        required:
                        - name
                        type: object
                      branch:
                        description: |-
                          Branch is the Git branch to checkout. If unspecified, the operator will
                          default to the repository's default branch.
                        type: string
                      path:
                        description: |-
                          Path is the repository-relative path to the file containing the configuration
                          (for example `config/app.yaml`). This field is required when `git` is used.
                        type: string
                      repoURL:
                        description: |-
                          Repo is the HTTPS or SSH URL of the Git repository to clone (for example
                          `https://github.com/myorg/configs.git`). This field is required when `git` is used.
                        type: string
                      revision:
                        description: |-
                          Revision is an optional Git revision (branch, tag, or commit SHA). If
                          unspecified, the operator will default to the repository's default branch.
                        type: string
                    required:
                    - path
                    - repoURL
                    type: object
                type: object
              targets:
                description: |-
                  Targets is the list of target resources to apply the rendered
                  configuration to. Each target contains `namespace`, `name`, and `type`.
                items:
                  properties:
                    cluster:
                      description: |-
                        Cluster identifies the named cluster boundary in spec.clusters. An empty
                        value or "local" targets the cluster in which the operator is running.
                      type: string
                    name:
                      description: Name is the name of the target ConfigMap or Secret.
                      type: string
                    namespace:
                      description: |-
                        Namespace is the namespace in which the target resource should be
                        created or updated.
                      type: string
                    type:
                      description: |-
                        Type is the type of the Kubernetes resource to write. Valid values are
                        `ConfigMap` or `Secret`.
                      enum:
                      - ConfigMap
                      - Secret
                      - Deployment
                      type: string
                  required:
                  - name
                  - namespace
                  - type
                  type: object
                minItems: 1
                type: array
              template:
                description: Template enables Go-template rendering for source YAML
                  manifests.
                properties:
                  data:
                    additionalProperties:
                      type: string
                    description: Data contains string values exposed to templates
                      as .Data and .Values.
                    type: object
                type: object
              transform:
                description: Transform selects an optional external manifest transform.
                properties:
                  args:
                    description: |-
                      Args contains additional arguments passed to the selected binary.
                      Arguments are passed directly and are never interpreted by a shell.
                    items:
                      type: string
                    type: array
                  binary:
                    description: Binary is an optional executable name or absolute
                      path.
                    type: string
                  release:
                    description: Release is the Helm release name when Type=helm.
                    type: string
                  type:
                    description: Type is kustomize, helm, or jsonnet.
                    enum:
                    - kustomize
                    - helm
                    - jsonnet
                    type: string
                required:
                - type
                type: object
              webhook:
                description: Webhook enables authenticated webhook-triggered reconciliation.
                properties:
                  enabled:
                    description: Enabled serves the Git push webhook endpoint.
                    type: boolean
                  path:
                    description: Path is the optional webhook URL path suffix.
                    type: string
                  secretRef:
                    description: SecretRef references a Secret containing `token`
                      or `secret`.
                    properties:
                      name:
                        description: Name is the name of the referenced object (ConfigMap
                          or Secret).
                        type: string
                      namespace:
                        description: Namespace is the namespace of the referenced
                          object.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - enabled
                type: object
            required:
            - targets
            type: object
          status:
            description: status defines the observed state of ConfigSync
            properties:
              appliedTargets:
                description: |-
                  AppliedTargets is the number of targets that were successfully
                  created or updated during the last sync.
                type: integer
              conditions:
                description: |-
                  Conditions represent the current state of the ConfigSync resource.
                  This follows the Kubernetes condition convention (type, status, reason,
                  message, lastTransitionTime).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              environment:
                description: Environment records the resolved environment name.
                type: string
              environmentBranch:
                description: EnvironmentBranch records the resolved Git branch.
                type: string
              environmentOverlay:
                description: EnvironmentOverlay records the resolved repository-relative
                  overlay path.
                type: string
              lastSyncedTime:
                description: |-
                  conditions represent the current state of the ConfigSync resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                  LastSyncedTime is the timestamp of the last successful sync operation.
                format: date-time
                type: string
              managedResources:
                description: ManagedResources records objects owned by this ConfigSync
                  for pruning.
                items:
                  description: ManagedObjectRef identifies a resource created by this
                    ConfigSync.
                  properties:
                    apiVersion:
                      type: string
                    cluster:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                type: array
              previousSourceRevision:
                description: |-
                  PreviousSourceRevision records the revision applied before the current
                  revision, when a sync changes revisions.
                type: string
              prunedResources:
                description: PrunedResources is the number of resources removed by
                  the latest sync.
                type: integer
              rollbackRevision:
                description: RollbackRevision records the explicit rollback revision,
                  if any.
                type: string
              sourcePath:
                description: SourcePath records the path within the source repository
                  that was applied during the last sync.
                type: string
              sourceRevision:
                description: |-
                  SourceRevision records the source revision (for example a Git SHA) that
                  was applied during the last sync.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
